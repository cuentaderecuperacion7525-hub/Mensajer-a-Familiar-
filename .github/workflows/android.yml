name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK y aceptar licencias
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true
          fi

      - name: Preparar debug.keystore consistente para firma
        run: |
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "::error::Falta debug.keystore.base64 en el repositorio. No se genera una llave aleatoria porque rompería las actualizaciones encima (error de paquete)."
            exit 1
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ejecutar pruebas unitarias
        run: gradle :app:testDebugUnitTest --tests 'com.example.Example*'

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug

      - name: Preparar APK con nombre versionado
        run: |
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          SRC_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          mkdir -p dist-apk
          cp "$SRC_APK" "dist-apk/NidoFamiliar-v${VERSION_NAME}-c${VERSION_CODE}-debug.apk"
          echo "APK_PATH=dist-apk/NidoFamiliar-v${VERSION_NAME}-c${VERSION_CODE}-debug.apk" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Subir APK compilado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NidoFamiliar-debug-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release con APK para actualización desde la app
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}-c${VERSION_CODE}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK_PATH" --clobber
            else
              gh release create "$TAG" "$APK_PATH" \
                --title "NidoFamiliar v${VERSION_NAME} (Build ${VERSION_CODE})" \
                --notes "Versión ${VERSION_NAME} (compilación ${VERSION_CODE}) firmada de forma consistente para actualizar encima sin desinstalar."
            fi
          fi
