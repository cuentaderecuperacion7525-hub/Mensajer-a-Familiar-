name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK y aceptar licencias
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true
          fi

      - name: Preparar debug.keystore consistente para firma
        env:
          FALLBACK_KEYSTORE_B64: ""
        run: |
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            printf '%s' "$FALLBACK_KEYSTORE_B64" | tr -d '\r\n' | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "::error::No se pudo preparar debug.keystore para firmar el APK."
            exit 1
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Preparar google-services.json para Firebase
        env:
          FALLBACK_GOOGLE_SERVICES_JSON: '{"project_info":{"project_number":"281741684428","project_id":"studio-5138141273-4196b","storage_bucket":"studio-5138141273-4196b.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:281741684428:android:652c037d4f543fc0c79c69","android_client_info":{"package_name":"com.aistudio.nidofamiliar.mrxqkp"}},"oauth_client":[{"client_id":"281741684428-be67hemkr92ivthsc353cc7nap09klcd.apps.googleusercontent.com","client_type":1,"android_info":{"package_name":"com.aistudio.nidofamiliar.mrxqkp","certificate_hash":"d4335cc1447f9e42db7256c323abd2d08a2cbdb5"}},{"client_id":"281741684428-qch1q9mbck1l1uf7fnc91gekcna31rdv.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDSIMqBGkq-eA7lx5APzjjXoksDSlXbIJw"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"281741684428-qch1q9mbck1l1uf7fnc91gekcna31rdv.apps.googleusercontent.com","client_type":3}]}}}],"configuration_version":"1"}'
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -s app/google-services.json ]; then
            printf '%s' "$FALLBACK_GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::No se pudo preparar app/google-services.json."
            exit 1
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ejecutar pruebas unitarias
        run: gradle :app:testDebugUnitTest --tests 'com.example.Example*'

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug

      - name: Preparar APK con nombre versionado
        run: |
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          SRC_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          mkdir -p dist-apk
          cp "$SRC_APK" "dist-apk/FamiChat-v${VERSION_NAME}-c${VERSION_CODE}-debug.apk"
          echo "APK_PATH=dist-apk/FamiChat-v${VERSION_NAME}-c${VERSION_CODE}-debug.apk" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Subir APK compilado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamiChat-debug-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release con APK para actualización desde la app
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}-c${VERSION_CODE}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK_PATH" --clobber
            else
              gh release create "$TAG" "$APK_PATH" \
                --title "FamiChat v${VERSION_NAME} (Build ${VERSION_CODE})" \
                --notes "Versión ${VERSION_NAME} (compilación ${VERSION_CODE}) firmada de forma consistente para actualizar encima sin desinstalar."
            fi
          fi
